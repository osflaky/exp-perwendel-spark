name: Spark Framework CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ['1.8', '1.9', '1.10', '1.11', '17', '21', '25']
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm, 
            macos-15-intel, macos-latest]
        include:
        - {java: '1.8', os: windows-latest}
      max-parallel: 10
    name: leg ${{ matrix.java }} | ${{ matrix.os }}
    steps:
    - uses: actions/checkout@master
    - name: Setup java
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
        architecture: x64
    - run: ./mvnw test
    timeout-minutes: 150
