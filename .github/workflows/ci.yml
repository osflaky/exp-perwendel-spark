name: Spark Framework CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ['1.8', '1.9', '1.10', '1.11']
        os: [ubuntu-latest]
        include:
        - {java: '1.8', os: windows-latest}
    name: Java Version ${{ matrix.java }} (${{ matrix.os }})
    steps:
    - uses: actions/checkout@master
    - name: Setup java
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
        architecture: x64
    - run: ./mvnw test
    timeout-minutes: 150
